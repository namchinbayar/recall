# Proton Pass (since 2026-11-21; this replaced a 1Password `op run` setup). The env files hold
# pass:// references (a Proton Pass vault); recall-pass-run (contrib/bin) logs in with recall's
# Proton Pass personal access token, stored TPM-encrypted as a systemd credential by
# contrib/bin/recall-pass-token-store and handed over below, then starts the command through
# `pass-cli run`. Token-login sessions last 2 h; the wrapper logs in again when needed.
# If Proton can't be reached, the start fails and Restart=on-failure retries.
[Service]
# A user unit can't wait for network-online.target, so wait for Proton's API name instead.
ExecStartPre=/bin/sh -c 'for i in $$(seq 60); do getent hosts pass-api.proton.me >/dev/null && exit 0; sleep 2; done; exit 1'
LoadCredentialEncrypted=recall-pass-token:%h/.config/credstore.encrypted/recall-pass-token.cred
ExecStart=
ExecStart=%h/.local/bin/recall-pass-run --env-file=%h/.config/recall/env -- %h/.local/bin/recall stream spool
