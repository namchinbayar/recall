[project]
name = "recall"
version = "0.1.0"
description = "Personal knowledge base on MongoDB Atlas with semantic search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymongo>=4.10",
    "voyageai>=0.3",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "pypdf>=5.0",
    "psutil>=6.0",
    "anthropic>=1.0",
    "cryptography>=43.0",
    "confluent-kafka[avro,schemaregistry]>=2.6",
    "mcp>=1.20",
    # Imported by the online server and the MCP tools; mcp brings them in, but recall uses them itself.
    "pyjwt[crypto]>=2.10",
    "starlette>=0.48",
    "anyio>=4.9",
    "pydantic>=2.12",
]

[project.scripts]
recall = "recall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
